stream.rules = [
  {
    matches = [
      # Replace with your headset's node.name or application.name
      { node.name = "alsa_output.usb-FIIO_FiiO_K11-01.analog-stereo" }
    ]
    actions = {
      update-props = {
        state.restore-props = false
        state.default-volume = 1.0
      }
    }
  }
]
